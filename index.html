<style>

   LAYOUT: stage fills the screen; menu card on the start side, bottom sheet in portrait */
:root{--grape:#24104a;--grape2:#3a1a72;--sun:#ffd23f;--pink:#ff4fa3;--mint:#4fe3c1;--ol:#2b1640;color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--grape);color:#fff;font:16px/1.5 "Baloo Bhaijaan 2",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#gl,#stage{position:fixed;inset:0;width:100%;height:100%;display:block}

#menu{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;pointer-events:none;
 padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));transition:opacity .35s}
#menu.off{opacity:0;visibility:hidden}

h1{margin:0;font-size:clamp(34px,5vw,46px);line-height:1.05;font-weight:800;color:var(--sun);text-shadow:0 4px 0 var(--pink)}
.lede{margin:6px 0 4px;font-size:16px;opacity:.9}

section{margin-top:18px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}

.top{display:flex;align-items:center;gap:12px}

</style>

  cam.position.set(X+L.lx*0.7,2.35+L.y*0.35,-L.dist+4.6);cam.lookAt(X+L.lx*0.45,1.15+L.y*0.2,-L.dist-7);
  sky.position.copy(cam.position);R3.setViewport(R.x,H-R.y-R.h,R.w,R.h);R3.setScissor(R.x,H-R.y-R.h,R.w,R.h);R3.render(scene,cam);L.cam=cam;L.R=R;});
 R3.setScissorTest(false);
 // overlay per lane
 RC.lanes.forEach((L,i)=>{const R=L.R,cam=L.cam,ci=INST[i];if(!R||!ci)return;const w=S.world,c=cx;
  const head=toScreen(ci.rig.bone('head'),cam,R),u=Math.min(R.w,R.h);
  for(const fx of L.fx){if(fx.done)continue;fx.done=true;burst(head.x+u*0.05,head.y-u*0.05,10+Math.min(fx.combo,8),w==='castle'?['#d9c8ff','#b38cff','#ffffff']:['#ffd23f','#fff3a0','#ffffff','#ffb02e'],'star',0.5,u/700);
   L.rings.push({x:head.x,y:head.y-u*0.04,t:0,s:u*0.1});texts.push({txt:fx.combo>=2?'+1 x'+(fx.combo+1):'+1',x:head.x+u*0.1,y:head.y-u*0.06,c:'#ffd23f',s:0.4+Math.min(fx.combo,6)*0.04,t:0,life:0.8});}

  for(let k=L.rings.length-1;k>=0;k--){const r=L.rings[k];r.t+=dt;if(r.t>0.45){L.rings.splice(k,1);continue;}const p=r.t/0.45;c.strokeStyle=`rgba(255,220,80,${1-p})`;c.lineWidth=r.s*0.12*(1-p)+1;ell(c,r.x,r.y,r.s*(0.3+p*1.2),r.s*(0.3+p*1.2));c.stroke();}
  if(L.cheer>0.3)bigText(c,'NICE!',head.x,head.y-u*0.12,u*0.07,'#4fe3c1');
  if(L.flash>0.3)bigText(c,'OOPS!',head.x,head.y-u*0.12,u*0.075,'#ff9ec0');
  const fs=Math.max(13,u*0.05),pad=fs*0.6;c.save();c.beginPath();c.rect(R.x,R.y,R.w,R.h);c.clip();
  rrect(c,R.x+pad,R.y+pad,fs*8.6,fs*1.8,fs*0.9);c.fillStyle='rgba(20,8,44,.62)';c.fill();
  ell(c,R.x+pad+fs*0.95,R.y+pad+fs*0.9,fs*0.6,fs*0.6);c.fillStyle=PC[L.i];c.fill();c.font=`800 ${fs*0.8}px "Baloo Bhaijaan 2",system-ui`;c.textAlign='center';c.textBaseline='middle';c.fillStyle=OL;c.fillText(String(L.i+1),R.x+pad+fs*0.95,R.y+pad+fs*0.95);
  const pz=1+L.pulse*0.5,cxp=R.x+pad+fs*2.4,cyp=R.y+pad+fs*0.9;ell(c,cxp,cyp,fs*0.42*pz,fs*0.42*pz);c.fillStyle=w==='castle'?'#b38cff':'#ffcc22';c.fill();c.strokeStyle=w==='castle'?'#7a3cff':'#b8860b';c.lineWidth=2;c.stroke();
  c.fillStyle=L.pulse>0?'#ffd23f':'#fff';c.textAlign='left';c.font=`800 ${fs*(1+L.pulse*0.25)}px "Baloo Bhaijaan 2",system-ui`;c.fillText(String(L.coins),R.x+pad+fs*3.1,R.y+pad+fs*1.0);
  c.fillStyle='#fff';c.font=`800 ${fs}px "Baloo Bhaijaan 2",system-ui`;c.fillText(fmt(L.time),R.x+pad+fs*5.5,R.y+pad+fs*1.0);
  const bx=R.x+R.w*0.12,bw=R.w*0.76,by=R.y+R.h-pad-fs*0.4;rrect(c,bx,by-fs*0.13,bw,fs*0.26,fs*0.13);c.fillStyle='rgba(255,255,255,.35)';c.fill();
  RC.lanes.forEach(o=>{const p=clamp(o.dist/RACE_LEN,0,1);ell(c,bx+bw*p,by,fs*0.42,fs*0.42);c.fillStyle=PC[o.i];c.fill();c.strokeStyle=OL;c.lineWidth=2;c.stroke();});
  starPath(c,bx+bw,by,fs*0.5,fs*0.22);c.fillStyle='#ffd23f';c.fill();
  if(L.fin){c.fillStyle='rgba(20,8,44,.3)';c.fillRect(R.x,R.y,R.w,R.h);bigText(c,n>1?(L.place===1?'1ST!':'2ND!'):'FINISH!',R.x+R.w/2,R.y+R.h*0.4,u*0.16,'#ffd23f');}
  c.restore();});
 if(n>1){cx.fillStyle='#ffd23f';if(W>=H)cx.fillRect(W/2-3,0,6,H);else cx.fillRect(0,H/2-3,W,6);}
 if(RC.phase==='count'){const k=Math.ceil(3.2-el),fs=Math.min(W,H)*0.2;if(k>0&&k<=3)bigText(cx,String(k),W/2,H*0.45,fs*(1.15-(el%1)*0.3),'#ffd23f');}
 else if(el<4.1)bigText(cx,'GO!',W/2,H*0.45,Math.min(W,H)*0.2,'#4fe3c1');
}

function fmt(tm){return Math.floor(tm/60)+':'+String(Math.floor(tm%60)).padStart(2,'0');}
function showRaceEnd(){
 const n=RC.lanes.length;let best={};try{best=JSON.parse(localStorage.getItem('dance-best')||'{}');}catch(e){}
 let html='';const sorted=[...RC.lanes].sort((a,b)=>(a.fin?a.time:1e9)-(b.fin?b.time:1e9));
 sorted.forEach(L=>{const st=L.hits<=1?3:L.hits<=4?2:1;
  html+=`<div class="rrow"><i style="background:${PC[L.i]}">${L.i+1}</i><b>${CH[S.players[L.i]].n}</b><span>${L.fin?fmt(L.time):'--'}</span><span>${L.coins} coins</span><span class="st">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span></div>`;
  if(L.fin&&(!best[S.world]||L.time<best[S.world])){best[S.world]=L.time;html+=`<div class="rec">New record!</div>`;}});
 try{localStorage.setItem('dance-best',JSON.stringify(best));}catch(e){}
 $('reTitle').textContent=n>1?`${CH[S.players[sorted[0].i]].n} wins!`:`${WORLDS[S.world].n} complete!`;$('reRows').innerHTML=html;$('raceEnd').classList.add('on');
 for(let i=0;i<4;i++)burst(W*(0.2+i*0.2),H*0.3,20,['#ff4fa3','#ffd23f','#4fe3c1','#8a5cff','#ffffff'],'confetti',1.2,1);SFX.win();
}


// ---------- dance frame ----------
function gest3(s,ci,dt,cam,R){
 const w=s.Wd;if(!w)return;const J=[15,16,13,14,27,28,25,26,0];
 if(s.pw){let m=0;for(const i of J)m+=Math.hypot(w[i].x-s.pw[i].x,w[i].y-s.pw[i].y,w[i].z-s.pw[i].z);s.motion=lerp(s.motion,m/J.length/dt,0.2);}
 s.pw=w.map(p=>({x:p.x,y:p.y,z:p.z}));s.energy=clamp(s.energy+(s.motion-0.5)*dt*0.4,0,1);
 for(const k in s.cool)s.cool[k]-=dt;
 const head=toScreen(ci.rig.bone('head'),cam,R),u=Math.min(R.w,R.h);s.P={hc:head,hr:u*0.05,S:u*0.06};
 if(seq.frozen)return;const ch=CH[S.players[s.i]],cols=[ch.c,'#ffd23f','#ffffff'];
 const up=w[15].y>w[0].y+0.06&&w[16].y>w[0].y+0.06;s.upT=up?s.upT+dt:0;
 if(s.upT>0.3&&s.cool.up<0){s.cool.up=2.5;burst(head.x,head.y-u*0.05,34,cols,'star',1.1,u/600);say(pick(['WOW!','BRAVO!','YAY!','SUPER!']),head.x,head.y-u*0.16,ch.c);SFX.ting();}
 const wd=Math.hypot(w[15].x-w[16].x,w[15].y-w[16].y,w[15].z-w[16].z);if(wd>0.45)s.apart=0.6;else s.apart-=dt;
 if(wd<0.13&&s.apart>0&&s.cool.clap<0){s.cool.clap=0.35;s.apart=0;const hm=toScreen(ci.rig.bone('hL').add(ci.rig.bone('hR')).multiplyScalar(0.5),cam,R);burst(hm.x,hm.y,12,['#ff4f86','#ff9ec0','#ffd23f'],'heart',0.6,u/500);SFX.clap();}
 for(const hk of ['hL','hR']){const p=ci.rig.bone(hk);if(s['p'+hk]){const v=p.distanceTo(s['p'+hk])/dt;if(v>3.2&&Math.random()<0.6){const q=toScreen(p,cam,R);burst(q.x,q.y,1,cols,'spark',0.25,u/600);if(s.cool.spark<0){SFX.sparkle();s.cool.spark=0.45;}}}s['p'+hk]=p;}
 if(s.Kv&&s.hipsReal){const hy=mid(s.Kv.lh,s.Kv.rh).y;if(s.phy!=null){const vy=(s.phy-hy)/dt/(s.sv||1);if(vy>2.8&&s.cool.jump<0){s.cool.jump=0.9;const f=toScreen(ci.holder.position.clone(),cam,R);burst(f.x,f.y,26,['#ff4fa3','#ffd23f','#4fe3c1','#8a5cff','#ffffff'],'confetti',1,u/500);say('JUMP!',head.x,head.y-u*0.15,'#4fe3c1',0.8);SFX.boing();}}s.phy=hy;}
}
let danceBuilding=false;
function danceFrame(dt,now,b,bp,act){
 G.race.visible=false;G.dance.visible=true;if(curEnv!=='d'&&ENV.d)setEnv('d');
 if(DS.built!==S.bg&&!danceBuilding){danceBuilding=true;buildDance(S.bg).finally(()=>{danceBuilding=false;});}
 const n=S.count,R={x:0,y:0,w:W,h:H};let k=0;
 for(let i=0;i<3;i++){const ci=i<n?ensureChar(i):INST[i];if(!ci)continue;const vis=i<n;ci.holder.visible=vis;ci.blob.visible=vis;if(!vis)continue;
  const s=slots[i],live=state==='play'&&!demoPlay&&s.Wd&&s.Kv&&now-s.lastSeen<1000;
  const h=ci.holder;h.rotation.set(0,0,0);let tx=(i-(n-1)/2)*1.45;const idle=state==='play'&&!demoPlay&&!live;
  if(live&&cam.videoWidth){const hx=mid(s.Kv.lh,s.Kv.rh).x/cam.videoWidth;tx=clamp((hx-0.5)*6.5,-3.2,3.2);
   const hy=mid(s.Kv.lh,s.Kv.rh).y;if(s.baseHip==null)s.baseHip=hy;const dv=(s.baseHip-hy)/(s.sv||1);if(Math.abs(dv)<0.2||dv<0)s.baseHip=lerp(s.baseHip,hy,0.03);ci.vy=clamp(dv*0.55,0,1.1);}else ci.vy=0;
  ci.x=ci.x==null?tx:lerp(ci.x,tx,1-Math.exp(-dt*8));h.position.set(ci.x,0,0);
  if(idle){play(ci,'Idle',0.3);ci.mixer.update(dt);ci.y=0;h.position.y=0;}
  else{stopClips(ci);const T=live?camTargets(s):danceTargets(b+i*0.37,i*1.1);s.T=lerpT(s.T,T,live?1:1-Math.exp(-dt*12));
   ci.rig.pose(s.T);const off=ci.rig.foot0-(ci.rig.feetY()-h.position.y);ci.y=ci.y==null?off:lerp(ci.y,off,1-Math.exp(-dt*18));h.position.y=ci.y+ci.vy;}
  ci.blob.position.set(ci.x,0.02,0);ci.blob.scale.setScalar(clamp(1-ci.vy*0.4,0.5,1));k++;}
 const dist=4.4+(n-1)*1.4,sw=Math.sin(t*0.25)*0.35;camD.aspect=W/H;camD.fov=W/H<0.9?60:40;camD.updateProjectionMatrix();
 camD.position.set(sw,1.5,dist*(W/H<0.9?1.35:1));camD.lookAt(0,1.0,0);
 sun.target.position.set(0,0,0);sun.position.set(4,9,6);
 animDance(t,bp,b);
 sky.position.copy(camD.position);R3.setScissorTest(false);R3.setViewport(0,0,W,H);R3.render(scene,camD);
 if(state==='play'){for(const s of act){const ci=INST[s.i];if(ci)gest3(s,ci,dt,camD,R);}}
}
function drawMeters(c,act){
 const n=S.count,fs=Math.max(14,Math.min(W,H)*0.035),pw=Math.min(W*0.28,fs*11),ph=fs*2.3,top=Math.max(12,fs*0.6);
 for(let i=0;i<n;i++){const s=slots[i],ch=CH[S.players[i]],on=act.includes(s);
  const x=n===1?W/2-pw/2:(i===0?14:i===1?W-pw-14:W/2-pw/2),y=top+(i===2?ph+8:0);
  c.globalAlpha=on?1:0.45;rrect(c,x,y,pw,ph,ph/2);c.fillStyle='rgba(20,8,44,.62)';c.fill();
  ell(c,x+ph/2,y+ph/2,ph*0.36,ph*0.36);c.fillStyle=PC[i];c.fill();c.fillStyle=OL;c.font=`800 ${fs*0.8}px "Baloo Bhaijaan 2",system-ui`;c.textAlign='center';c.textBaseline='middle';c.fillText(String(i+1),x+ph/2,y+ph/2+1);
  c.fillStyle='#fff';c.textAlign='left';c.font=`800 ${fs}px "Baloo Bhaijaan 2",system-ui`;c.fillText(ch.n,x+ph*0.95,y+ph*0.36);
  const bx=x+ph*0.95,bw=pw-ph*1.4,by=y+ph*0.68;rrect(c,bx,by-fs*0.18,bw,fs*0.36,fs*0.18);c.fillStyle='rgba(255,255,255,.18)';c.fill();
  rrect(c,bx,by-fs*0.18,Math.max(fs*0.36,bw*s.energy),fs*0.36,fs*0.18);c.fillStyle=ch.c;c.fill();
  if(S.mode==='freeze'){c.fillStyle='#ffd23f';for(let k=0;k<Math.min(s.stars,8);k++){starPath(c,x+pw-fs*0.6-k*fs*0.95,y+ph*0.34,fs*0.42,fs*0.18);c.fill();}}}
 c.globalAlpha=1;}

// ---------- main loop ----------
let last=performance.now();
function frame(now){
 const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;
 const b=getBeat(),bp=Math.exp(-(b%1)*4);
 cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,W,H);
 const racing=state==='play'&&S.mode==='race'&&RC.on;let act=[];
 if(state==='play'){
  if(demoPlay){for(let i=0;i<S.count;i++){slots[i].demo=true;}}
  else if(landmarker&&cam.readyState>=2){
   if(cam.currentTime!==lastVT){lastVT=cam.currentTime;try{const r=landmarker.detectForVideo(cam,now);lastRaw=r.landmarks||[];assign(lastRaw,r.worldLandmarks||[],cam.videoWidth,cam.videoHeight,now);}catch(e){console.warn(e);}}
   act=slots.slice(0,S.count).filter(s=>s.Kv&&now-s.lastSeen<1000);
   for(const s of act){springSlot(s,dt,now);spring3(s,dt);}}
 }
 if(racing)raceFrame3(dt,now,bp);else{danceFrame(dt,now,b,bp,act);if(state==='play')fgUpdate(act);}
 drawParts(cx,dt);
 if(state==='play'){if(!racing){drawFreeze(cx);drawMeters(cx,act);}drawPip(cx);
  if(H>W*1.05)bigText(cx,'Rotate your phone',W/2,H*0.96,Math.min(W,H)*0.04,'#ffffff');}
 requestAnimationFrame(frame);
}

// ---------- thumbnails (dev) ----------
window.__shot=async(kind,key,w=360,h=300)=>{
 const oldPlayers=S.players.slice(),oldCount=S.count,oldBg=S.bg;R3.setPixelRatio(1);R3.setSize(w,h,false);W=w;H=h;
 const show=async()=>{for(let k=0;k<40;k++){let ok=true;for(let i=0;i<S.count;i++)if(!ensureChar(i))ok=false;if(ok&&!danceBuilding&&DS.built===S.bg)break;if(DS.built!==S.bg&&!danceBuilding){danceBuilding=true;await buildDance(S.bg);danceBuilding=false;}await new Promise(r=>setTimeout(r,100));}};
 if(kind==='char'){S.players[0]=key;S.count=1;S.bg='stage';await show();for(let i=0;i<3;i++)if(INST[i]){INST[i].holder.visible=i===0;INST[i].blob.visible=i===0;}
  G.dance.visible=false;setSky('#3a1a72','#8a5cff','#5a2aa0',100,200);const ci=INST[0];ci.holder.rotation.set(0,0.35,0);ci.holder.position.set(0,0,0);ci.mixer.stopAllAction();ci.cur=null;play(ci,'Cheer',0);ci.mixer.update(0.55);
  camD.aspect=w/h;camD.fov=30;camD.updateProjectionMatrix();camD.position.set(0,0.95,3.6);camD.lookAt(0,0.8,0);R3.setScissorTest(false);R3.setViewport(0,0,w,h);R3.render(scene,camD);}
 else if(kind==='stage'||kind==='game'){S.bg=kind==='stage'?key:(key==='freeze'?'snow':'stage');S.count=key==='race'?1:2;if(kind==='game')S.players=key==='free'?['pinkknight','mage','fairy']:['icemage','aqua','fairy'];await show();
  danceFrame(0.016,performance.now(),1.5,1,[]);}
 if(kind==='world'||(kind==='game'&&key==='race')){const wk=kind==='world'?key:'forest';S.world=wk;S.count=1;S.players[0]=kind==='game'?'pinkknight':'fairy';RC.course=makeCourse(WK.indexOf(wk)*97+11);RC.lanes=[newLane(0)];RC.lanes[0].dist=12;RC.lanes[0].speed=7;RC.lanes[0].ph=1;
  await buildRace(wk,1,RC.course);while(!ensureChar(0))await new Promise(r=>setTimeout(r,60));RC.ready=true;RC.t0=t-10;RC.phase='run';RC.on=true;const sv=demoPlay;demoPlay=true;raceFrame3(0.016,performance.now(),1);demoPlay=sv;RC.on=false;}
 const url=gl.toDataURL('image/jpeg',0.85);S.players=oldPlayers;S.count=oldCount;S.bg=oldBg;resize();return url;};


resize();renderAll();requestAnimationFrame(frame);
window.__dance={S,RC,get slots(){return slots},startPlay,backToMenu,FG,INST};
